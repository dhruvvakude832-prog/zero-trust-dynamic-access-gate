# ==============================================================================
# NGINX REVERSE PROXY GATE CONFIGURATION (Continuous Adaptive Trust Engine)
# ==============================================================================
# This configuration demonstrates the Policy Enforcement Point (PEP) pattern
# using ngx_http_auth_request_module to query the Trust Engine before serving
# protected pages (Public: 20, Profile: 40, Payment: 60, Admin: 80).
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream Trust Engine & Backend App
    upstream trust_backend {
        server 127.0.0.1:3000;
    }

    server {
        listen       8080;
        server_name  localhost;

        # ----------------------------------------------------------------------
        # Internal Auth Verification Subrequest (The Gate Query)
        # Nginx asks: "Is this session trusted enough for this page?"
        # ----------------------------------------------------------------------
        location = /engine/verify {
            internal;
            proxy_pass http://trust_backend/api/gate/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Original-IP $remote_addr;
            proxy_set_header X-Original-UA $http_user_agent;
            proxy_set_header Cookie $http_cookie;
        }

        # ----------------------------------------------------------------------
        # 1. PUBLIC PAGE (Required Trust: 20)
        # ----------------------------------------------------------------------
        location /public {
            auth_request /engine/verify;
            auth_request_set $trust_score $upstream_http_x_trust_score;
            auth_request_set $gate_decision $upstream_http_x_gate_decision;

            error_page 401 = @step_up_challenge;
            error_page 403 = @session_blocked;

            proxy_pass http://trust_backend/public;
            proxy_set_header X-Trust-Score $trust_score;
        }

        # ----------------------------------------------------------------------
        # 2. PROFILE PAGE (Required Trust: 40)
        # ----------------------------------------------------------------------
        location /profile {
            auth_request /engine/verify;
            auth_request_set $trust_score $upstream_http_x_trust_score;
            auth_request_set $gate_decision $upstream_http_x_gate_decision;

            error_page 401 = @step_up_challenge;
            error_page 403 = @session_blocked;

            proxy_pass http://trust_backend/profile;
            proxy_set_header X-Trust-Score $trust_score;
        }

        # ----------------------------------------------------------------------
        # 3. PAYMENT PAGE (Required Trust: 60)
        # ----------------------------------------------------------------------
        location /payment {
            auth_request /engine/verify;
            auth_request_set $trust_score $upstream_http_x_trust_score;
            auth_request_set $gate_decision $upstream_http_x_gate_decision;

            error_page 401 = @step_up_challenge;
            error_page 403 = @session_blocked;

            proxy_pass http://trust_backend/payment;
            proxy_set_header X-Trust-Score $trust_score;
        }

        # ----------------------------------------------------------------------
        # 4. ADMIN PAGE (Required Trust: 80)
        # ----------------------------------------------------------------------
        location /admin {
            auth_request /engine/verify;
            auth_request_set $trust_score $upstream_http_x_trust_score;
            auth_request_set $gate_decision $upstream_http_x_gate_decision;

            error_page 401 = @step_up_challenge;
            error_page 403 = @session_blocked;

            proxy_pass http://trust_backend/admin;
            proxy_set_header X-Trust-Score $trust_score;
        }

        # ----------------------------------------------------------------------
        # Intercept Handlers for Step-Up (401) and Block (403)
        # ----------------------------------------------------------------------
        location @step_up_challenge {
            return 401 '{"status":"STEP_UP_REQUIRED","message":"Trust score below threshold. Step-up 2FA code required."}';
            default_type application/json;
        }

        location @session_blocked {
            return 403 '{"status":"BLOCK_TERMINATE","message":"Trust score critical (< 20) or anomalous event. Session terminated."}';
            default_type application/json;
        }

        # ----------------------------------------------------------------------
        # Static Assets & Base Frontend Dashboard
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://trust_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
